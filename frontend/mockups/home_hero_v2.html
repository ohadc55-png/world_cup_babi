<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מונדיאל 2026 · בית · v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1A;
    --bg-deep: #05070D;
    --surface: #0F1422;
    --text: #F4F6FB;
    --muted: #8A93A6;
    --gold: #FFD93D;
    --red: #E63946;
    --navy: #1D3557;
    --green: #06A77D;
  }

  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  html, body {
    background: var(--bg-deep);
    font-family: 'Rubik', system-ui, sans-serif;
    color: var(--text);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(900px 500px at 50% -100px, rgba(255,255,255,0.04), transparent 60%),
      radial-gradient(800px 600px at 50% 120%, rgba(230,57,70,0.04), transparent 60%),
      var(--bg-deep);
  }

  .phone-frame {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 0 0 8px #0d1118,
      0 0 0 9px rgba(255,255,255,0.06),
      0 50px 100px -20px rgba(0,0,0,0.85),
      0 24px 50px -12px rgba(230,57,70,0.10),
      0 -24px 50px -12px rgba(6,167,125,0.06);
  }

  .phone-scroll {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    position: relative;
    background:
      radial-gradient(600px 400px at 50% -80px, rgba(255,255,255,0.04), transparent 65%),
      var(--bg);
  }
  .phone-scroll::-webkit-scrollbar { display: none; }

  /* Page-level grain */
  .page-grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.025;
    background-image:
      repeating-conic-gradient(from 0deg at 50% 50%, #fff 0deg 1deg, transparent 1deg 3deg);
    mix-blend-mode: overlay;
    z-index: 1;
  }

  /* PREMIUM NUMERALS */
  .num {
    direction: ltr;
    unicode-bidi: isolate;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1, "ss01" 1, "cv11" 1, "kern" 1;
  }
  .num-tight {
    letter-spacing: -0.04em;
  }

  /* DISPLAY HEBREW — punchy */
  .hbrw-display {
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  /* CAPS EYEBROWS — extreme tracking */
  .eyebrow {
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .eyebrow-tight {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.20em;
    text-transform: uppercase;
  }

  /* ============== HERO LAYERED BACKGROUND ============== */
  .hero {
    position: relative;
    height: 480px;
    overflow: hidden;
  }

  /* (a) Mesh-style base — sophisticated tri-color blend */
  .hero-mesh {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(80% 60% at 100% 0%, #E63946 0%, rgba(230,57,70,0) 55%),
      radial-gradient(70% 60% at 0% 100%, #06A77D 0%, rgba(6,167,125,0) 55%),
      radial-gradient(120% 100% at 50% 50%, #1D3557 0%, #14253E 70%, #0E1A2C 100%);
    background-size: 180% 180%, 180% 180%, 100% 100%;
    animation: meshBreathe 30s ease-in-out infinite;
  }
  @keyframes meshBreathe {
    0%, 100% { background-position: 100% 0%, 0% 100%, 50% 50%; }
    50%      { background-position: 85% 8%, 12% 92%, 50% 50%; }
  }

  /* (b) Edge vignette */
  .hero-vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(140% 100% at 50% 50%, transparent 35%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.10) 0%, transparent 25%, transparent 70%, rgba(0,0,0,0.50) 100%);
    pointer-events: none;
  }

  /* (c) Stadium silhouette at bottom */
  .hero-stadium {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 130px;
    pointer-events: none;
    opacity: 0.5;
  }

  /* Stadium floodlight glow */
  .hero-floodlight {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 380px;
    height: 220px;
    background: radial-gradient(closest-side, rgba(255,255,255,0.10), transparent 70%);
    pointer-events: none;
  }

  /* (d) Scan lines */
  .hero-scanlines {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.022) 0px,
      rgba(255,255,255,0.022) 1px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* (e) Diagonal light leak from top-right */
  .hero-lightleak {
    position: absolute;
    top: -60px;
    right: -120px;
    width: 360px;
    height: 360px;
    background: linear-gradient(225deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 60%);
    filter: blur(50px);
    transform: rotate(18deg);
    opacity: 0.85;
    animation: leakShimmer 12s ease-in-out infinite;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  @keyframes leakShimmer {
    0%, 100% { opacity: 0.65; transform: rotate(18deg) translateX(0); }
    50%      { opacity: 0.95; transform: rotate(20deg) translateX(-12px); }
  }

  /* Architectural diagonal line accent */
  .hero-rule {
    position: absolute;
    left: -10%;
    right: -10%;
    top: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07) 35%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.07) 65%, transparent);
    transform: rotate(-3deg);
    pointer-events: none;
  }

  /* Chyron (broadcast match number) */
  .chyron {
    position: absolute;
    z-index: 5;
    font-weight: 800;
    color: rgba(255,255,255,0.10);
    font-size: 96px;
    line-height: 0.85;
    letter-spacing: -0.06em;
    font-feature-settings: "tnum" 1, "ss01" 1;
    direction: ltr;
    pointer-events: none;
    user-select: none;
  }

  /* Editorial team names — diagonal */
  .team-name-1 {
    transform: rotate(-2deg);
  }
  .team-name-2 {
    transform: rotate(2deg);
  }

  /* Flag accent */
  .flag-accent {
    font-size: 22px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }

  /* COUNTDOWN — massive premium */
  .countdown {
    font-size: 104px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.06em;
    line-height: 0.85;
    text-shadow:
      0 4px 40px rgba(0,0,0,0.45),
      0 0 60px rgba(255,255,255,0.05);
    font-feature-settings: "tnum" 1, "ss01" 1, "cv11" 1;
  }
  .countdown-colon {
    color: rgba(255,255,255,0.45);
    margin: 0 -2px;
  }

  /* Glass CTA */
  .cta-glass {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    box-shadow:
      0 12px 32px -8px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.22);
    transition: transform 220ms cubic-bezier(0.2,0.8,0.2,1), background 220ms ease, box-shadow 220ms ease;
  }
  .cta-glass:hover, .cta-glass:active {
    background: rgba(255,255,255,0.18);
    transform: translateY(-1px);
    box-shadow:
      0 16px 40px -8px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .cta-arrow { transition: transform 220ms ease; }
  .cta-glass:hover .cta-arrow { transform: translateX(-6px); }

  /* Hero NEXT MATCH pill */
  .next-pill {
    background: rgba(0,0,0,0.32);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* Live dot pulse */
  .live-dot {
    width: 7px; height: 7px; border-radius: 999px;
    background: var(--red);
    box-shadow: 0 0 0 0 rgba(230,57,70,0.7);
    animation: livePulse 1.2s ease-out infinite;
  }
  @keyframes livePulse {
    0%   { box-shadow: 0 0 0 0 rgba(230,57,70,0.7); }
    70%  { box-shadow: 0 0 0 7px rgba(230,57,70,0); }
    100% { box-shadow: 0 0 0 0 rgba(230,57,70,0); }
  }

  /* Stagger entrance */
  .anim-in {
    opacity: 0;
    transform: translateY(10px);
    animation: rise 600ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  .d1 { animation-delay: 60ms; }
  .d2 { animation-delay: 140ms; }
  .d3 { animation-delay: 220ms; }
  .d4 { animation-delay: 300ms; }
  .d5 { animation-delay: 380ms; }
  .d6 { animation-delay: 460ms; }

  /* Header — barely there */
  .header-strip {
    background: linear-gradient(180deg, rgba(10,14,26,0.78), rgba(10,14,26,0.30) 70%, transparent);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
  }

  /* Logo mark — tri-color monogram */
  .logo-mark {
    width: 18px; height: 18px;
    border-radius: 5px;
    background: conic-gradient(from 210deg, #E63946 0 33%, #1D3557 33% 66%, #06A77D 66% 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.10),
      0 4px 14px -4px rgba(230,57,70,0.4);
    position: relative;
  }
  .logo-mark::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 2px;
    background: var(--bg);
  }
  .logo-mark::before {
    content: "";
    position: absolute;
    inset: 6.5px;
    border-radius: 999px;
    background: linear-gradient(135deg, #FFD93D, #FFAA00);
    z-index: 2;
    box-shadow: 0 0 6px rgba(255,217,61,0.5);
  }

  /* Gold hairline divider */
  .gold-rule {
    width: 60px;
    height: 1px;
    margin: 28px auto;
    background: linear-gradient(90deg, transparent, rgba(255,217,61,0.30) 30%, rgba(255,217,61,0.30) 70%, transparent);
  }

  /* Bottom nav refined */
  .nav-bottom {
    background: rgba(10,14,26,0.88);
    backdrop-filter: saturate(160%) blur(22px);
    -webkit-backdrop-filter: saturate(160%) blur(22px);
    border-top: 1px solid rgba(255,255,255,0.04);
  }

  .nav-item {
    position: relative;
  }
  .nav-active-dot {
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: var(--red);
    box-shadow:
      0 0 8px rgba(230,57,70,0.9),
      0 0 16px rgba(230,57,70,0.5);
  }

  /* Live pill — refined, almost lost */
  .live-pill {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 999px;
    padding: 8px 14px;
    transition: background 200ms ease, border-color 200ms ease;
  }
  .live-pill:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.10);
  }

  /* Leaderboard reveal */
  .lb-row {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    transition: background 200ms ease, border-color 200ms ease;
  }
  .lb-row:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,217,61,0.20);
  }

  .gold-num {
    color: var(--gold);
    text-shadow: 0 0 18px rgba(255,217,61,0.25);
  }

  /* Status row vertical divider */
  .v-divider {
    width: 1px;
    height: 14px;
    background: rgba(255,255,255,0.12);
  }

  /* Avatar small */
  .avatar-sm {
    width: 28px; height: 28px;
    border-radius: 999px;
    background: linear-gradient(135deg, #E63946, #1D3557);
    display: grid; place-items: center;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    box-shadow:
      0 4px 12px -4px rgba(230,57,70,0.5),
      inset 0 0 0 1px rgba(255,255,255,0.18);
    flex-shrink: 0;
  }

  /* No tap highlight */
  .no-tap { -webkit-tap-highlight-color: transparent; }
</style>
</head>

<body>
  <div class="phone-frame">
    <!-- Notch -->
    <div style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:28px;border-radius:999px;background:#000;z-index:60;box-shadow:0 0 0 1px rgba(255,255,255,0.04);"></div>

    <div class="phone-scroll no-tap">
      <div class="page-grain"></div>

      <!-- ============== STRIP HEADER — 44px, nearly invisible ============== -->
      <header class="header-strip sticky top-0 z-50" style="padding-top:36px;">
        <div class="flex items-center justify-between px-5" style="height:44px;">
          <!-- Bell (left) -->
          <button class="relative w-9 h-9 -ms-2 rounded-full flex items-center justify-center hover:bg-white/5 transition-colors">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F4F6FB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-[#E63946]"></span>
          </button>

          <!-- Wordmark + mark (right in RTL) -->
          <div class="flex items-center gap-2">
            <div class="text-[13.5px] font-extrabold tracking-tight text-white" style="font-weight:800;">
              מונדיאל <span class="num">2026</span>
            </div>
            <div class="logo-mark"></div>
          </div>
        </div>
      </header>

      <!-- ============== STATUS ROW — thin, inline ============== -->
      <section class="anim-in d1 px-5 pt-3 pb-3">
        <div class="flex items-center gap-2.5 justify-end">
          <span class="num text-[11px] text-[#8A93A6] font-medium tracking-wide" style="letter-spacing:0.04em;">
            מקום <span class="text-white font-bold num-tight">3</span>
            <span class="text-[#3F465A] mx-0.5">·</span>
            <span class="text-white font-bold num-tight">247</span> <span class="text-[#8A93A6]">נק׳</span>
          </span>
          <div class="v-divider"></div>
          <span class="text-[12px] font-semibold text-white">אוהד</span>
          <div class="avatar-sm">א</div>
        </div>
      </section>

      <!-- ============== HERO — 480px, edge-to-edge cinematic ============== -->
      <section class="anim-in d2 hero">
        <!-- Layers -->
        <div class="hero-mesh"></div>
        <div class="hero-floodlight"></div>
        <div class="hero-lightleak"></div>
        <div class="hero-scanlines"></div>
        <div class="hero-vignette"></div>
        <div class="hero-rule"></div>

        <!-- Stadium silhouette SVG at the bottom -->
        <svg class="hero-stadium" viewBox="0 0 390 130" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Stands roofline -->
          <path d="M0,130 L0,90 Q40,72 80,80 L120,68 Q160,58 200,62 L240,52 Q280,46 320,54 L360,64 Q380,70 390,82 L390,130 Z"
                fill="rgba(255,255,255,0.045)"/>
          <!-- Second stand layer -->
          <path d="M0,130 L0,108 Q60,98 120,102 L180,94 Q240,90 300,98 L360,104 Q380,107 390,112 L390,130 Z"
                fill="rgba(255,255,255,0.035)"/>
          <!-- Floodlight pylons -->
          <line x1="50" y1="78" x2="50" y2="120" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
          <line x1="195" y1="60" x2="195" y2="120" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
          <line x1="340" y1="64" x2="340" y2="120" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
          <!-- Floodlight tops -->
          <rect x="46" y="74" width="8" height="4" rx="0.5" fill="rgba(255,255,255,0.10)"/>
          <rect x="191" y="56" width="8" height="4" rx="0.5" fill="rgba(255,255,255,0.12)"/>
          <rect x="336" y="60" width="8" height="4" rx="0.5" fill="rgba(255,255,255,0.10)"/>
        </svg>

        <!-- Broadcast chyron — match number -->
        <div class="chyron num" style="bottom: 150px; left: 18px;">01<span style="font-size:42px;opacity:0.55;letter-spacing:0;"> vs </span>02</div>

        <!-- HERO CONTENT -->
        <div class="relative z-10 h-full flex flex-col" style="padding: 20px 22px 22px;">

          <!-- TOP META — eyebrow + countdown pill -->
          <div class="flex items-center justify-between">
            <span class="next-pill inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-semibold text-white">
              <span class="live-dot" style="background:#E63946;"></span>
              בעוד <span class="num">2</span> שעות <span class="num">14</span> דקות
            </span>
            <span class="eyebrow text-white/55">המשחק הבא</span>
          </div>

          <!-- TEAMS — diagonal, asymmetric editorial layout -->
          <div class="relative flex-1 mt-3">

            <!-- Team A (Mexico) — RIGHT side, upper, rotated -2 -->
            <div class="absolute team-name-1" style="top: 6px; right: 0;">
              <div class="flex items-baseline gap-2" style="direction:rtl;">
                <span class="flag-accent">🇲🇽</span>
                <span class="hbrw-display text-white" style="font-size:38px; line-height:0.9;">מקסיקו</span>
              </div>
              <div class="text-right mt-1 pe-1">
                <span class="num text-[10px] font-bold tracking-[0.28em] text-white/55">MEX</span>
              </div>
            </div>

            <!-- Team B (Canada) — LEFT side, lower, rotated +2 -->
            <div class="absolute team-name-2" style="top: 78px; left: 0;">
              <div class="flex items-baseline gap-2" style="direction:rtl;">
                <span class="hbrw-display text-white" style="font-size:38px; line-height:0.9;">קנדה</span>
                <span class="flag-accent">🇨🇦</span>
              </div>
              <div class="text-left mt-1 ps-1">
                <span class="num text-[10px] font-bold tracking-[0.28em] text-white/55">CAN</span>
              </div>
            </div>

          </div>

          <!-- COUNTDOWN — centered, slightly offset -->
          <div class="relative text-center" style="margin-top: 8px; padding-inline-start: 14px;">
            <div class="num countdown">
              <span>02</span><span class="countdown-colon">:</span><span>14</span><span class="countdown-colon">:</span><span>38</span>
            </div>
            <div class="mt-2 flex items-center justify-center gap-3 text-[8.5px] font-bold text-white/55"
                 style="letter-spacing:0.40em;">
              <span>HOURS</span>
              <span class="text-white/25">·</span>
              <span>MINUTES</span>
              <span class="text-white/25">·</span>
              <span>SECONDS</span>
            </div>
          </div>

          <!-- CTA + caption pinned to bottom -->
          <div class="mt-auto pt-5">
            <button class="cta-glass w-full h-12 rounded-full font-extrabold text-[16px] text-white flex items-center justify-center gap-2 tracking-tight">
              <span>נחש עכשיו</span>
              <svg class="cta-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
            </button>

            <!-- Bottom caption -->
            <p class="text-center mt-3 text-[10px] font-medium text-white/55"
               style="letter-spacing:0.18em; text-transform:uppercase;">
              <span>אצטדיון אזטקה</span>
              <span class="mx-1.5 text-white/25">·</span>
              <span>מקסיקו סיטי</span>
              <span class="mx-1.5 text-white/25">·</span>
              <span class="num">22:00</span> <span>IST</span>
            </p>
          </div>
        </div>
      </section>

      <!-- ============== BELOW HERO — restraint ============== -->
      <main class="px-5 pb-28">

        <!-- Gold hairline divider -->
        <div class="anim-in d3 gold-rule"></div>

        <!-- LIVE NOW — compact pill, almost lost -->
        <section class="anim-in d4 flex items-center justify-center">
          <div class="live-pill inline-flex items-center gap-2.5 text-[12px]">
            <span class="live-dot"></span>
            <span class="font-bold tracking-[0.18em] uppercase text-[#E63946] text-[10px]">חי עכשיו</span>
            <span class="text-white/15">|</span>
            <span class="font-semibold text-white">🇧🇷 ברזיל</span>
            <span class="num font-extrabold text-white num-tight">2</span>
            <span class="text-white/35 num">–</span>
            <span class="num font-extrabold text-white num-tight">1</span>
            <span class="font-semibold text-white">ארגנטינה 🇦🇷</span>
            <span class="text-white/15">|</span>
            <span class="num font-bold text-[#8A93A6] text-[11px]">67'</span>
          </div>
        </section>

        <!-- TOP OF LEADERBOARD — single row reveal -->
        <section class="anim-in d5 mt-8">
